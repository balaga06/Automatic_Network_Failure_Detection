{% extends "base.html" %}

{% block content %}

<h2>🚨 Alert History</h2>

<table>
<tr>
<th>Node</th>
<th>Status</th>
<th>Time</th>
<th>Message</th>
</tr>

{% for alert in alerts %}
<tr>
<td>{{ alert.name }}</td>
<td class="{{ alert.alert_type }}">{{ alert.alert_type }}</td>
<td>{{ alert.alert_time }}</td>
<td>{{ alert.message }}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
