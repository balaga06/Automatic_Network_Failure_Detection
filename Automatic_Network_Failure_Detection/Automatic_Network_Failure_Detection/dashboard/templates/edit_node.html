{% extends "base.html" %}

{% block content %}

<h2>Edit Network Node</h2>

<form method="POST" action="/update_node/{{ node.id }}">

<label>Node Name</label><br>
<input type="text" name="name" value="{{ node.name }}" required><br><br>

<label>IP Address</label><br>
<input type="text" name="ip" value="{{ node.ip_address }}"><br><br>

<label>Parent Node</label><br>
<select name="parent_id">

{% for parent in parents %}
<option value="{{ parent.id }}"
{% if parent.id == node.parent_id %}selected{% endif %}>
{{ parent.name }}
</option>
{% endfor %}

</select><br><br>

<button type="submit">Update Network</button>

</form>

{% endblock %}
